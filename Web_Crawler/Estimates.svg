<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792.1708541143507 889.7619047619046" width="5376.512562343052" height="2669.2857142857138"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1792.1708541143507" height="889.7619047619046" fill="#1b1715"></rect><g transform="translate(629.2857142857141 10) rotate(0 422.8086419753072 85.83333333333303)"><text x="0" y="120.99066666666623" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="137.33333333333283px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Web Crawler </text></g><g transform="translate(10 249.7619047619046) rotate(0 407.1428571428574 315)"><text x="407.1428571428574" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">What type of content will be store? </text><text x="407.1428571428574" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-Html basics </text><text x="407.1428571428574" y="121.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="407.1428571428574" y="166.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">How many pages we will be Crawl each Month?</text><text x="407.1428571428574" y="211.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-Average page Crawled each month == 10^9</text><text x="407.1428571428574" y="256.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="407.1428571428574" y="301.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-Average Page Size == 2.5MB -&gt; 2.5*10^9</text><text x="407.1428571428574" y="346.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="407.1428571428574" y="391.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-Monthly Storage requirements ==</text><text x="407.1428571428574" y="436.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">(2.5*10^9)*10^6 ----&gt;2.5*10^15</text><text x="407.1428571428574" y="481.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="407.1428571428574" y="526.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-yearly Storage Requirements == </text><text x="407.1428571428574" y="571.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2.5*10^15*12 ---&gt; 3*10^16</text><text x="407.1428571428574" y="616.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text></g><g stroke-linecap="round"><g transform="translate(830.285714285715 749.2413833172959) rotate(0 221.40476190476147 -211.04926308721952)"><path d="M0 0 C101.86 -95.84, 203.15 -192.96, 442.81 -422.1 M0 0 C133.95 -125.17, 266.8 -251.49, 442.81 -422.1" stroke="#d3d3d3" stroke-width="2" fill="none"></path></g><g transform="translate(830.285714285715 749.2413833172959) rotate(0 221.40476190476147 -211.04926308721952)"><path d="M442.81 -422.1 C442.56 -419.25, 439.81 -415.64, 437.43 -408.1 L437.43 -408.1 C434.41 -410.15, 433.15 -413.17, 428.62 -417.22 L428.62 -417.22 C433.81 -417.4, 438.9 -420.89, 442.81 -422.1" stroke="none" stroke-width="0" fill="#d3d3d3" fill-rule="evenodd"></path><path d="M442.81 -422.1 C442.56 -419.25, 439.81 -415.64, 437.43 -408.1 M437.43 -408.1 C434.41 -410.15, 433.15 -413.17, 428.62 -417.22 M428.62 -417.22 C433.81 -417.4, 438.9 -420.89, 442.81 -422.1" stroke="#d3d3d3" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(1272.5910506475539 203.21428571428623) rotate(0 254.78990173339855 202.5)"><text x="254.78990173339844" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Assuming Storing for 5 years</text><text x="254.78990173339844" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-5yrs*3*10^16</text><text x="254.78990173339844" y="121.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">---&gt; 1.5*10^17</text><text x="254.78990173339844" y="166.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="254.78990173339844" y="211.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="254.78990173339844" y="256.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Converting into petaByte </text><text x="254.78990173339844" y="301.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">-1.5*10^17/1024^5</text><text x="254.78990173339844" y="346.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">----&gt; 133PB</text><text x="254.78990173339844" y="391.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"> </text></g></svg>